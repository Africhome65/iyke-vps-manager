{% extends "base.html" %}
{% block title %}Security settings · Iyke VPS Manager{% endblock %}
{% block content %}
<div class="page-heading"><div><div class="eyebrow">ACCOUNT SECURITY</div><h1>Change password</h1><p class="muted">Use a unique password of at least 16 characters.</p></div></div>
<section class="panel auth-panel">
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Current password<input type="password" name="current_password" autocomplete="current-password" required></label>
    <label>New password<input type="password" name="new_password" autocomplete="new-password" minlength="16" required></label>
    <label>Confirm new password<input type="password" name="confirm_password" autocomplete="new-password" minlength="16" required></label>
    <button class="button primary" type="submit">Update password</button>
  </form>
</section>
{% endblock %}
